schemaVersion: 1
app:
  name: 星际温室
  description: 点击收集星光、建设自动设施并重生成长的增量游戏
  subdomain: stgreen
services:
  web:
    kind: web
    build:
      context: .
      dockerfile: Dockerfile
    port: 8080
    env:
      PORT: "8080"
    resources:
      cpu: 0.5
      memoryMiB: 128
    healthcheck:
      type: http
      path: /healthz
routes:
  - path: /
    match: prefix
    service: web
    stripPrefix: false
